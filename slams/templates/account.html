{% extends "base.html" %}{% block title %}My account{% endblock %}{% block body %}
<h1>Change password</h1>
<form method="post" class="card form narrow"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Current password<input type="password" name="current" required></label>
<label>New password (8+ characters)<input type="password" name="new" minlength="8" required></label>
<button class="btn primary">Change password</button></form>
{% endblock %}
