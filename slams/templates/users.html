{% extends "base.html" %}{% block title %}Users{% endblock %}{% block body %}
<h1>Users</h1>
<form method="post" class="card form inlineform"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h2>Add user</h2><label>Username<input name="username" required></label><label>Full name<input name="full_name" required></label>
  <label>Password (8+)<input type="password" name="password" required minlength="8"></label>
  <label>Role<select name="role">{% for r in roles %}<option>{{ r }}</option>{% endfor %}</select></label><button class="btn primary">Create</button></form>
<table><tr><th>Username</th><th>Name</th><th>Role</th><th>Status</th><th></th></tr>
{% for u in rows %}<tr><td>{{ u.username }}</td><td>{{ u.full_name }}</td><td>{{ u.role }}</td><td>{{ 'Active' if u.active else 'Disabled' }}</td>
<td><form method="post" action="{{ url_for('user_toggle', uid=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button class="btn small">{{ 'Disable' if u.active else 'Enable' }}</button></form></td></tr>{% endfor %}</table>
{% endblock %}
